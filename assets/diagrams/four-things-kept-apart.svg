<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Four things kept apart.</title><desc id="desc">Four architectural separations: source identity versus representation, preserved evidence versus model attention, model proposals versus researcher authority, and outputs versus analytical state.</desc><rect width="1600" height="900" fill="#FAF9F7"/><style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600&amp;display=swap');
.display{font-family:'Instrument Serif',Georgia,serif}.body{font-family:'Figtree',Arial,sans-serif}.mono{font-family:'DM Mono','Courier New',monospace;letter-spacing:1.8px}.subtitle{font-size:20px;fill:#555555}.h2{font-size:30px;fill:#0F0F0F}.h3{font-size:23px;fill:#0F0F0F}.bodytext{font-size:17px;fill:#555555}.small{font-size:14px;fill:#555555}.label{font-size:14px;fill:#555555;letter-spacing:2px}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/></marker><marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C8432F"/></marker></defs><text x="40" y="68" class="display" style="font-size:48px;fill:#0F0F0F;"><tspan style="fill:#0F0F0F;">Four things </tspan><tspan style="fill:#C8432F;font-style:italic;">kept apart.</tspan></text><text x="42" y="116" class="body subtitle" text-anchor="start">The architecture remains understandable because different kinds of objects are not silently collapsed into one another.</text><rect x="38" y="170" width="520" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="218" class="display h2" text-anchor="start">Source identity</text><text x="62" y="254" class="body bodytext" text-anchor="start"><tspan x="62" dy="0">A specific work, with stable</tspan><tspan x="62" dy="24">citation and metadata.</tspan></text><line x1="595" y1="178" x2="595" y2="302" stroke="#C8432F" stroke-width="5"/><rect x="635" y="170" width="515" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="660" y="218" class="display h2" text-anchor="start">Source representation</text><text x="660" y="254" class="body bodytext" text-anchor="start"><tspan x="660" dy="0">Extracted pages and passages.</tspan><tspan x="660" dy="24">These can be rebuilt in different formats.</tspan></text><text x="1190" y="201" class="mono label" text-anchor="start">WHY IT MATTERS</text><text x="1190" y="236" class="body" text-anchor="start" fill="#2A2A2A"><tspan x="1190" dy="0">Changing extraction or storage format</tspan><tspan x="1190" dy="27">does not change which work was cited.</tspan></text><rect x="38" y="344" width="520" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="392" class="display h2" text-anchor="start">Preserved evidence</text><text x="62" y="428" class="body bodytext" text-anchor="start"><tspan x="62" dy="0">The retained evidence record stays</tspan><tspan x="62" dy="24">stored and addressable.</tspan></text><line x1="595" y1="352" x2="595" y2="476" stroke="#C8432F" stroke-width="5"/><rect x="635" y="344" width="515" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="660" y="392" class="display h2" text-anchor="start">Model-facing attention</text><text x="660" y="428" class="body bodytext" text-anchor="start"><tspan x="660" dy="0">A bounded selection of passages</tspan><tspan x="660" dy="24">is sent to the model.</tspan></text><text x="1190" y="375" class="mono label" text-anchor="start">WHY IT MATTERS</text><text x="1190" y="410" class="body" text-anchor="start" fill="#2A2A2A"><tspan x="1190" dy="0">What the model sees is a bounded</tspan><tspan x="1190" dy="27">selection from a larger preserved record.</tspan></text><rect x="38" y="518" width="520" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="566" class="display h2" text-anchor="start">Model proposals</text><text x="62" y="602" class="body bodytext" text-anchor="start"><tspan x="62" dy="0">Candidate claims, plans and syntheses,</tspan><tspan x="62" dy="24">even when well formed.</tspan></text><line x1="595" y1="526" x2="595" y2="650" stroke="#C8432F" stroke-width="5"/><rect x="635" y="518" width="515" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="660" y="566" class="display h2" text-anchor="start">Researcher authority</text><text x="660" y="602" class="body bodytext" text-anchor="start"><tspan x="660" dy="0">Admit, qualify, defer or reject,</tspan><tspan x="660" dy="24">with review depth recorded.</tspan></text><text x="1190" y="549" class="mono label" text-anchor="start">WHY IT MATTERS</text><text x="1190" y="584" class="body" text-anchor="start" fill="#2A2A2A"><tspan x="1190" dy="0">Fluent output is not accepted state</tspan><tspan x="1190" dy="27">until a person explicitly judges it.</tspan></text><rect x="38" y="692" width="520" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="740" class="display h2" text-anchor="start">Generated outputs</text><text x="62" y="776" class="body bodytext" text-anchor="start"><tspan x="62" dy="0">A memo, brief or report written</tspan><tspan x="62" dy="24">for one audience.</tspan></text><line x1="595" y1="700" x2="595" y2="824" stroke="#C8432F" stroke-width="5"/><rect x="635" y="692" width="515" height="140" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="660" y="740" class="display h2" text-anchor="start">Analytical state</text><text x="660" y="776" class="body bodytext" text-anchor="start"><tspan x="660" dy="0">Accepted evidence, claims, gaps</tspan><tspan x="660" dy="24">and decisions.</tspan></text><text x="1190" y="723" class="mono label" text-anchor="start">WHY IT MATTERS</text><text x="1190" y="758" class="body" text-anchor="start" fill="#2A2A2A"><tspan x="1190" dy="0">A report is a projection of the state,</tspan><tspan x="1190" dy="27">not the state itself.</tspan></text><text x="40" y="866" class="body small" text-anchor="start">Illustrative architecture from the Governed Research State paper and current website positioning. Counts and examples are omitted here for conceptual clarity.</text></svg>