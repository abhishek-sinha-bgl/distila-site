<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Models propose. State persists. Humans authorise.</title><desc id="desc">Epistamate Research Workspace diagram showing six research stages, model-proposed work, persistent governed state, human authority and iteration routes.</desc><rect width="1600" height="900" fill="#FAF9F7"/><style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600&amp;display=swap');
.display{font-family:'Instrument Serif',Georgia,serif}.body{font-family:'Figtree',Arial,sans-serif}.mono{font-family:'DM Mono','Courier New',monospace;letter-spacing:1.8px}.subtitle{font-size:20px;fill:#555555}.h2{font-size:30px;fill:#0F0F0F}.h3{font-size:23px;fill:#0F0F0F}.bodytext{font-size:17px;fill:#555555}.small{font-size:14px;fill:#555555}.label{font-size:14px;fill:#555555;letter-spacing:2px}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/></marker><marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C8432F"/></marker></defs><text x="40" y="64" class="display" style="font-size:46px;fill:#0F0F0F;"><tspan style="fill:#0F0F0F;">Models propose. </tspan><tspan style="fill:#C8432F;font-style:italic;">State persists. </tspan><tspan style="fill:#0F0F0F;">Humans authorise.</tspan></text><text x="40" y="108" class="body subtitle" text-anchor="start">Every stage can iterate as evidence changes. The governed record beneath the stages outlives any single model call.</text><rect x="228" y="146" width="196" height="108" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="246" y="176" class="mono small" text-anchor="start">01</text><text x="246" y="210" class="display h3" text-anchor="start"><tspan x="246" dy="0">Research</tspan><tspan x="246" dy="28">framing</tspan></text><line x1="424" y1="200" x2="450" y2="200" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="458" y="146" width="196" height="108" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="476" y="176" class="mono small" text-anchor="start">02</text><text x="476" y="210" class="display h3" text-anchor="start"><tspan x="476" dy="0">Planning</tspan></text><line x1="654" y1="200" x2="680" y2="200" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="688" y="146" width="196" height="108" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="706" y="176" class="mono small" text-anchor="start">03</text><text x="706" y="210" class="display h3" text-anchor="start"><tspan x="706" dy="0">Acquisition &amp;</tspan><tspan x="706" dy="28">Evidence Room</tspan></text><line x1="884" y1="200" x2="910" y2="200" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="918" y="146" width="196" height="108" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="936" y="176" class="mono small" text-anchor="start">04</text><text x="936" y="210" class="display h3" text-anchor="start"><tspan x="936" dy="0">Source-bounded</tspan><tspan x="936" dy="28">analysis</tspan></text><line x1="1114" y1="200" x2="1140" y2="200" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1148" y="146" width="196" height="108" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1166" y="176" class="mono small" text-anchor="start">05</text><text x="1166" y="210" class="display h3" text-anchor="start"><tspan x="1166" dy="0">Findings &amp;</tspan><tspan x="1166" dy="28">synthesis</tspan></text><line x1="1344" y1="200" x2="1370" y2="200" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1378" y="146" width="196" height="108" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1396" y="176" class="mono small" text-anchor="start">06</text><text x="1396" y="210" class="display h3" text-anchor="start"><tspan x="1396" dy="0">Continuation &amp;</tspan><tspan x="1396" dy="28">output</tspan></text><rect x="34" y="286" width="1532" height="120" rx="10" fill="#F3F1EE" stroke="none" stroke-width="0"/><text x="56" y="326" class="mono label" text-anchor="start"><tspan x="56" dy="0">MODEL</tspan><tspan x="56" dy="22">PROPOSES</tspan></text><rect x="228" y="300" width="196" height="92" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="326" y="335" class="body small" text-anchor="middle"><tspan x="326" dy="0">Sharpens wording, flags</tspan><tspan x="326" dy="21">ambiguity and adjacent questions.</tspan></text><line x1="326" y1="254" x2="326" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="458" y="300" width="196" height="92" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="556" y="335" class="body small" text-anchor="middle"><tspan x="556" dy="0">Proposes evidence obligations,</tspan><tspan x="556" dy="21">search routes and targets.</tspan></text><line x1="556" y1="254" x2="556" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="688" y="300" width="196" height="92" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="786" y="335" class="body small" text-anchor="middle"><tspan x="786" dy="0">Searches, reads and recovers</tspan><tspan x="786" dy="21">sources; bounded slices only.</tspan></text><line x1="786" y1="254" x2="786" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="918" y="300" width="196" height="92" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1016" y="335" class="body small" text-anchor="middle"><tspan x="1016" dy="0">Proposes candidate claims</tspan><tspan x="1016" dy="21">tied to exact passages.</tspan></text><line x1="1016" y1="254" x2="1016" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1148" y="300" width="196" height="92" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1246" y="335" class="body small" text-anchor="middle"><tspan x="1246" dy="0">Drafts findings, challenges,</tspan><tspan x="1246" dy="21">gaps and divergences.</tspan></text><line x1="1246" y1="254" x2="1246" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1378" y="300" width="196" height="92" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1476" y="335" class="body small" text-anchor="middle"><tspan x="1476" dy="0">Surfaces what is still</tspan><tspan x="1476" dy="21">unresolved and why.</tspan></text><line x1="1476" y1="254" x2="1476" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="34" y="430" width="1532" height="78" rx="10" fill="#0F0F0F" stroke="#0F0F0F" stroke-width="0"/><text x="58" y="466" class="mono" style="font-size:14px;fill:#FAF9F7;letter-spacing:2px;"><tspan x="58" dy="0">STATE</tspan><tspan x="58" dy="22">PERSISTS</tspan></text><line x1="228" y1="444" x2="228" y2="494" stroke="#777" stroke-width="1.5"/><text x="350" y="478" class="body" text-anchor="start" fill="#FAF9F7">Source identity · preserved evidence · candidate and admitted claims · gaps · dependencies · decisions · history</text><line x1="326" y1="392" x2="326" y2="420" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="556" y1="392" x2="556" y2="420" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="786" y1="392" x2="786" y2="420" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1016" y1="392" x2="1016" y2="420" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1246" y1="392" x2="1246" y2="420" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1476" y1="392" x2="1476" y2="420" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="34" y="548" width="1532" height="144" rx="10" fill="#F3F1EE" stroke="none" stroke-width="0"/><text x="56" y="588" class="mono label" text-anchor="start"><tspan x="56" dy="0">HUMAN</tspan><tspan x="56" dy="22">AUTHORISES</tspan></text><rect x="228" y="558" width="196" height="122" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="235" y1="558" x2="417" y2="558" stroke="#C8432F" stroke-width="2.5"/><circle cx="326" cy="558" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="326" y="598" class="display" text-anchor="middle" style="font-size:20px">Own scope</text><text x="326" y="627" class="body small" text-anchor="middle"><tspan x="326" dy="0">Question, intended use</tspan><tspan x="326" dy="20">and scope remain human.</tspan></text><line x1="326" y1="548" x2="326" y2="518" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="458" y="558" width="196" height="122" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="465" y1="558" x2="647" y2="558" stroke="#C8432F" stroke-width="2.5"/><circle cx="556" cy="558" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="556" y="598" class="display" text-anchor="middle" style="font-size:20px">Accept or reshape</text><text x="556" y="627" class="body small" text-anchor="middle"><tspan x="556" dy="0">Own the plan, scope</tspan><tspan x="556" dy="20">and constraints.</tspan></text><line x1="556" y1="548" x2="556" y2="518" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="688" y="558" width="196" height="122" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="695" y1="558" x2="877" y2="558" stroke="#C8432F" stroke-width="2.5"/><circle cx="786" cy="558" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="786" y="598" class="display" text-anchor="middle" style="font-size:20px">Decide what’s available</text><text x="786" y="627" class="body small" text-anchor="middle"><tspan x="786" dy="0">Decide what material is</tspan><tspan x="786" dy="20">available and admissible.</tspan></text><line x1="786" y1="548" x2="786" y2="518" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="918" y="558" width="196" height="122" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="925" y1="558" x2="1107" y2="558" stroke="#C8432F" stroke-width="2.5"/><circle cx="1016" cy="558" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="1016" y="593" class="display" text-anchor="middle"><tspan x="1016" dy="0">Admit / qualify /</tspan><tspan x="1016" dy="22">defer / reject</tspan></text><text x="1016" y="635" class="body small" text-anchor="middle"><tspan x="1016" dy="0">Decide which claims</tspan><tspan x="1016" dy="20">enter accepted state.</tspan></text><line x1="1016" y1="548" x2="1016" y2="518" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1148" y="558" width="196" height="122" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="1155" y1="558" x2="1337" y2="558" stroke="#C8432F" stroke-width="2.5"/><circle cx="1246" cy="558" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="1246" y="598" class="display" text-anchor="middle" style="font-size:20px">Decide the position</text><text x="1246" y="627" class="body small" text-anchor="middle"><tspan x="1246" dy="0">Decide what position follows</tspan><tspan x="1246" dy="20">from admitted state.</tspan></text><line x1="1246" y1="548" x2="1246" y2="518" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1378" y="558" width="196" height="122" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="1385" y1="558" x2="1567" y2="558" stroke="#C8432F" stroke-width="2.5"/><circle cx="1476" cy="558" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="1476" y="598" class="display" text-anchor="middle" style="font-size:20px">Record sufficiency</text><text x="1476" y="627" class="body small" text-anchor="middle"><tspan x="1476" dy="0">For a named use: issue,</tspan><tspan x="1476" dy="20">continue or reframe.</tspan></text><line x1="1476" y1="548" x2="1476" y2="518" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1488,680 L1488,746 L310,746 L310,698" stroke="#C8432F" stroke-width="2" fill="none" stroke-dasharray="7 7" marker-end="url(#arrowAccent)"/><text x="470" y="782" class="body" text-anchor="middle" fill="#C8432F">Reframe scope or question</text><text x="832" y="782" class="body" text-anchor="middle" fill="#C8432F">Acquire more evidence or different sources</text><text x="1220" y="782" class="body" text-anchor="middle" fill="#C8432F">Run another bounded pass</text><text x="40" y="846" class="body small" text-anchor="start">This is the current Research Workspace logic. Human approval governs state; it does not make weak evidence stronger.</text></svg>