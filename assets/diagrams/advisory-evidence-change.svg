<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">New evidence changes attention. It does not automatically rewrite advice.</title><desc id="desc">Advisory workflow diagram showing new evidence intake, consultant treatment, downstream affected work and the shared governance kernel.</desc><rect width="1600" height="900" fill="#FAF9F7"/><style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600&amp;display=swap');
.display{font-family:'Instrument Serif',Georgia,serif}.body{font-family:'Figtree',Arial,sans-serif}.mono{font-family:'DM Mono','Courier New',monospace;letter-spacing:1.8px}.subtitle{font-size:20px;fill:#555555}.h2{font-size:30px;fill:#0F0F0F}.h3{font-size:23px;fill:#0F0F0F}.bodytext{font-size:17px;fill:#555555}.small{font-size:14px;fill:#555555}.label{font-size:14px;fill:#555555;letter-spacing:2px}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/></marker><marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C8432F"/></marker></defs><text x="40" y="66" class="display" style="font-size:42px;fill:#0F0F0F;"><tspan style="fill:#0F0F0F;">New evidence </tspan><tspan style="fill:#C8432F;font-style:italic;">changes attention. </tspan><tspan style="fill:#0F0F0F;">It does not automatically rewrite advice.</tspan></text><text x="40" y="112" class="body subtitle" text-anchor="start">Epistamate can sit around an existing advisory method while keeping causal change visible.</text><rect x="36" y="158" width="1528" height="220" rx="10" fill="#F3F1EE" stroke="#DEDAD4" stroke-width="1.2"/><text x="60" y="205" class="mono label" text-anchor="start"><tspan x="60" dy="0">EVIDENCE</tspan><tspan x="60" dy="22">INTAKE AND</tspan><tspan x="60" dy="22">TREATMENT</tspan></text><rect x="220" y="180" width="280" height="168" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="240" y="208" class="mono small" text-anchor="start">01</text><text x="248" y="250" class="display h2" text-anchor="start"><tspan x="248" dy="0">New material</tspan><tspan x="248" dy="34">arrives</tspan></text><text x="248" y="310" class="body small" text-anchor="start"><tspan x="248" dy="0">Claim, study, data,</tspan><tspan x="248" dy="21">reframe or context.</tspan></text><line x1="506" y1="264" x2="538" y2="264" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="550" y="180" width="280" height="168" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="570" y="208" class="mono small" text-anchor="start">02</text><text x="578" y="250" class="display h2" text-anchor="start"><tspan x="578" dy="0">Bounded</tspan><tspan x="578" dy="34">attention</tspan></text><text x="578" y="310" class="body small" text-anchor="start"><tspan x="578" dy="0">Assess relevance</tspan><tspan x="578" dy="21">to active work.</tspan></text><line x1="836" y1="264" x2="868" y2="264" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="880" y="180" width="280" height="168" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="900" y="208" class="mono small" text-anchor="start">03</text><text x="908" y="250" class="display h2" text-anchor="start"><tspan x="908" dy="0">Exact source /</tspan><tspan x="908" dy="34">context</tspan></text><text x="908" y="310" class="body small" text-anchor="start"><tspan x="908" dy="0">Record provenance,</tspan><tspan x="908" dy="21">representation and fit.</tspan></text><line x1="1166" y1="264" x2="1168" y2="264" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1180" y="180" width="350" height="168" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1200" y="208" class="mono small" text-anchor="start">04</text><text x="1208" y="250" class="display h2" text-anchor="start"><tspan x="1208" dy="0">Consultant treatment</tspan></text><text x="1208" y="285" class="body small" text-anchor="start"><tspan x="1208" dy="0">use · qualify · keep in view · defer · reject</tspan><tspan x="1208" dy="21">Decide how new material should</tspan><tspan x="1208" dy="21">influence the advisory chain.</tspan></text><text x="60" y="460" class="mono label" text-anchor="start"><tspan x="60" dy="0">ADVISORY</tspan><tspan x="60" dy="22">CHAIN</tspan></text><text x="60" y="510" class="body small" text-anchor="start"><tspan x="60" dy="0">New evidence can affect</tspan><tspan x="60" dy="21">downstream work.</tspan></text><rect x="220" y="445" width="238" height="168" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="228" y1="445" x2="450" y2="445" stroke="#C8432F" stroke-width="2.5"/><circle cx="339" cy="445" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="339" y="497" class="display" text-anchor="middle" style="font-size:22px">Working proposition</text><text x="339" y="533" class="body small" text-anchor="middle"><tspan x="339" dy="0">Current question,</tspan><tspan x="339" dy="20">scope and approach.</tspan></text><line x1="462" y1="529" x2="484" y2="529" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="496" y="445" width="238" height="168" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.7" stroke-dasharray="7 6"/><circle cx="615" cy="445" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="615" y="497" class="display" text-anchor="middle" style="font-size:22px">Diagnostic</text><text x="615" y="533" class="body small" text-anchor="middle"><tspan x="615" dy="0">Interpretation and explanation</tspan><tspan x="615" dy="20">of what changes, if anything.</tspan></text><text x="615" y="595" class="body" text-anchor="middle" fill="#C8432F">affected: review</text><line x1="738" y1="529" x2="760" y2="529" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="772" y="445" width="238" height="168" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.7" stroke-dasharray="7 6"/><circle cx="891" cy="445" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="891" y="497" class="display" text-anchor="middle" style="font-size:22px">Finding</text><text x="891" y="533" class="body small" text-anchor="middle"><tspan x="891" dy="0">Revised or confirmed findings</tspan><tspan x="891" dy="20">based on upstream judgement.</tspan></text><text x="891" y="595" class="body" text-anchor="middle" fill="#C8432F">affected: review</text><line x1="1014" y1="529" x2="1036" y2="529" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1048" y="445" width="238" height="168" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.7" stroke-dasharray="7 6"/><circle cx="1167" cy="445" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="1167" y="497" class="display" text-anchor="middle" style="font-size:22px">Recommendation</text><text x="1167" y="533" class="body small" text-anchor="middle"><tspan x="1167" dy="0">Implications for advice</tspan><tspan x="1167" dy="20">and proposed action.</tspan></text><text x="1167" y="595" class="body" text-anchor="middle" fill="#C8432F">affected: review</text><line x1="1290" y1="529" x2="1312" y2="529" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1324" y="445" width="238" height="168" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.7" stroke-dasharray="7 6"/><circle cx="1443" cy="445" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="1443" y="497" class="display" text-anchor="middle" style="font-size:22px">Deliverable</text><text x="1443" y="533" class="body small" text-anchor="middle"><tspan x="1443" dy="0">Client output, briefing</tspan><tspan x="1443" dy="20">or communication.</tspan></text><text x="1443" y="595" class="body" text-anchor="middle" fill="#C8432F">affected: review</text><path d="M1450,613 L1450,670 L330,670 L330,623" stroke="#C8432F" stroke-width="2" fill="none" stroke-dasharray="7 7" marker-end="url(#arrowAccent)"/><text x="800" y="702" class="body" text-anchor="middle" fill="#C8432F">Downstream work is marked affected, not overwritten, until the upstream judgement is brought current.</text><rect x="36" y="760" width="1528" height="92" rx="10" fill="#0F0F0F" stroke="#0F0F0F" stroke-width="0"/><text x="65" y="798" class="mono" style="font-size:14px;fill:#FAF9F7;letter-spacing:2px;"><tspan x="65" dy="0">GOVERNANCE</tspan><tspan x="65" dy="22">KERNEL</tspan></text><line x1="260" y1="778" x2="260" y2="835" stroke="#777" stroke-width="1.5"/><text x="305" y="816" class="body" text-anchor="start" fill="#FAF9F7">evidence identity · bounded model work · authority · dependencies · history · change</text></svg>