070.7142857142858" y="345" class="display" text-anchor="middle" style="font-size:18px">Recommendations</text><rect x="1170.5714285714287" y="302" width="179.71428571428572" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1260.4285714285716" y="345" class="display" text-anchor="middle" style="font-size:18px">Controlled output</text><rect x="1360.2857142857142" y="302" width="179.71428571428572" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1450.142857142857" y="334" class="display" text-anchor="middle"><tspan x="1450.142857142857" dy="0">Update /</tspan><tspan x="1450.142857142857" dy="21">reassessment</tspan></text><rect x="36" y="410" width="1528" height="94" rx="10" fill="#F3F1EE" stroke="none" stroke-width="0"/><text x="58" y="464" class="mono label" text-anchor="start">POLICY</text><rect x="222" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="290.77777777777777" y="465" class="display" text-anchor="middle" style="font-size:18px">Framing</text><rect x="369.55555555555554" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="438.3333333333333" y="465" class="display" text-anchor="middle" style="font-size:18px">Plan</text><rect x="517.1111111111111" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="585.8888888888889" y="465" class="display" text-anchor="middle" style="font-size:18px">Evidence</text><rect x="664.6666666666666" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="733.4444444444443" y="465" class="display" text-anchor="middle" style="font-size:18px">Analysis</text><rect x="812.2222222222222" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="881" y="465" class="display" text-anchor="middle" style="font-size:18px">Coverage</text><rect x="959.7777777777777" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1028.5555555555554" y="465" class="display" text-anchor="middle" style="font-size:18px">Findings</text><rect x="1107.3333333333333" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1176.111111111111" y="465" class="display" text-anchor="middle" style="font-size:18px">Readiness</text><rect x="1254.8888888888887" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1323.6666666666665" y="465" class="display" text-anchor="middle" style="font-size:18px">Delta</text><rect x="1402.4444444444443" y="422" width="137.55555555555554" height="70" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1471.2222222222222" y="465" class="display" text-anchor="middle" style="font-size:18px">Next focus</text><line x1="340" y1="504" x2="340" y2="548" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="580" y1="504" x2="580" y2="548" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="820" y1="504" x2="820" y2="548" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1060" y1="504" x2="1060" y2="548" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1320" y1="504" x2="1320" y2="548" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1500" y1="504" x2="1500" y2="548" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="36" y="555" width="1528" height="94" rx="10" fill="#0F0F0F" stroke="#0F0F0F" stroke-width="0"/><text x="60" y="594" class="mono" style="font-size:14px;fill:#FAF9F7;letter-spacing:2px;"><tspan x="60" dy="0">KERNEL</tspan><tspan x="60" dy="22">SHARED</tspan></text><line x1="210" y1="574" x2="210" y2="632" stroke="#777" stroke-width="1.5"/><text x="255" y="611" class="body" text-anchor="start" fill="#FAF9F7">Evidence identity · bounded model work · candidate and accepted state · human authority · dependencies · history · change</text><text x="40" y="704" class="display" text-anchor="start" style="font-size:26px">What the shared layer does when evidence changes (advisory example)</text><rect x="40" y="730" width="255" height="72" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="46" y1="730" x2="289" y2="730" stroke="#C8432F" stroke-width="2.5"/><text x="167.5" y="773" class="display" text-anchor="middle" style="font-size:19px">Working proposition</text><text x="167.5" y="828" class="body small" text-anchor="middle" fill="#555555">consultant decides</text><line x1="303" y1="766" x2="347" y2="766" stroke="#C8432F" stroke-width="1.5" marker-end="url(#arrowAccent)"/><rect x="355" y="730" width="255" height="72" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.5" stroke-dasharray="7 6"/><text x="482.5" y="773" class="display" text-anchor="middle" style="font-size:19px">Diagnostic</text><text x="482.5" y="828" class="body small" text-anchor="middle" fill="#C8432F">affected: review</text><line x1="618" y1="766" x2="662" y2="766" stroke="#C8432F" stroke-width="1.5" marker-end="url(#arrowAccent)"/><rect x="670" y="730" width="255" height="72" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.5" stroke-dasharray="7 6"/><text x="797.5" y="773" class="display" text-anchor="middle" style="font-size:19px">Finding</text><text x="797.5" y="828" class="body small" text-anchor="middle" fill="#C8432F">affected: review</text><line x1="933" y1="766" x2="977" y2="766" stroke="#C8432F" stroke-width="1.5" marker-end="url(#arrowAccent)"/><rect x="985" y="730" width="255" height="72" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.5" stroke-dasharray="7 6"/><text x="1112.5" y="773" class="display" text-anchor="middle" style="font-size:19px">Recommendation</text><text x="1112.5" y="828" class="body small" text-anchor="middle" fill="#C8432F">affected: review</text><line x1="1248" y1="766" x2="1292" y2="766" stroke="#C8432F" stroke-width="1.5" marker-end="url(#arrowAccent)"/><rect x="1300" y="730" width="255" height="72" rx="8" fill="#FAF9F7" stroke="#C8432F" stroke-width="1.5" stroke-dasharray="7 6"/><text x="1427.5" y="773" class="display" text-anchor="middle" style="font-size:19px">Deliverable</text><text x="1427.5" y="828" class="body small" text-anchor="middle" fill="#C8432F">affected: review</text><text x="40" y="874" class="body small" text-anchor="start">Illustrative stage names from the current public site. The shared kernel is the constant; the professional method is not forced into one generic workflow.</text></svg>