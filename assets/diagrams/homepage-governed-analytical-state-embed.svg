<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="755" viewBox="0 145 1600 755" role="img" aria-labelledby="title desc"><title id="title">Frontier intelligence. Governed analytical state. Human authority.</title><desc id="desc">Epistamate homepage architecture diagram showing frontier intelligence across the workflow, governed analytical state beneath it, and human judgement at consequential gates.</desc><rect width="1600" height="900" fill="#FAF9F7"/><style>
