 stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1240" y1="244" x2="1240" y2="303" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1365" y="315" width="184" height="104" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1385" y="350" class="mono small" text-anchor="start">06</text><text x="1385" y="394" class="display h2" text-anchor="start">Output</text><line x1="1457" y1="244" x2="1457" y2="303" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="36" y="470" width="1528" height="106" rx="10" fill="#0F0F0F" stroke="#0F0F0F" stroke-width="0"/><text x="65" y="513" class="mono" style="font-size:14px;fill:#FAF9F7;letter-spacing:2px;"><tspan x="65" dy="0">GOVERNED</tspan><tspan x="65" dy="23">ANALYTICAL STATE</tspan></text><line x1="285" y1="488" x2="285" y2="558" stroke="#777" stroke-width="1.2"/><text x="340" y="533" class="body" text-anchor="start" fill="#FAF9F7">Sources · representations · claims · gaps · dependencies · decisions · history · what changed</text><line x1="372" y1="419" x2="372" y2="460" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="589" y1="419" x2="589" y2="460" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="806" y1="419" x2="806" y2="460" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1023" y1="419" x2="1023" y2="460" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1240" y1="419" x2="1240" y2="460" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1457" y1="419" x2="1457" y2="460" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="60" y="653" class="mono label" text-anchor="start"><tspan x="60" dy="0">HUMAN JUDGEMENT</tspan><tspan x="60" dy="20">AT CONSEQUENTIAL</tspan><tspan x="60" dy="20">GATES</tspan></text><rect x="270" y="630" width="205" height="116" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="278" y1="630" x2="467" y2="630" stroke="#C8432F" stroke-width="2.5"/><circle cx="372.5" cy="630" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="372.5" y="670" class="display h3" text-anchor="middle">scope</text><text x="372.5" y="700" class="body small" text-anchor="middle"><tspan x="372.5" dy="0">Is the question</tspan><tspan x="372.5" dy="20">worth answering?</tspan></text><line x1="372.5" y1="620" x2="372.5" y2="585" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="630" width="205" height="116" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="508" y1="630" x2="697" y2="630" stroke="#C8432F" stroke-width="2.5"/><circle cx="602.5" cy="630" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="602.5" y="670" class="display h3" text-anchor="middle">plan</text><text x="602.5" y="700" class="body small" text-anchor="middle"><tspan x="602.5" dy="0">Approve scope,</tspan><tspan x="602.5" dy="20">approach and sources.</tspan></text><line x1="602.5" y1="620" x2="602.5" y2="585" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="755" y="630" width="235" height="116" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="763" y1="630" x2="982" y2="630" stroke="#C8432F" stroke-width="2.5"/><circle cx="872.5" cy="630" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="872.5" y="670" class="display h3" text-anchor="middle">admit / qualify /</text><text x="872.5" y="700" class="body small" text-anchor="middle"><tspan x="872.5" dy="0">defer / reject</tspan><tspan x="872.5" dy="20">Decide what enters</tspan><tspan x="872.5" dy="20">the record.</tspan></text><line x1="872.5" y1="620" x2="872.5" y2="585" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1060" y="630" width="205" height="116" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="1068" y1="630" x2="1257" y2="630" stroke="#C8432F" stroke-width="2.5"/><circle cx="1162.5" cy="630" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="1162.5" y="670" class="display h3" text-anchor="middle">sufficiency</text><text x="1162.5" y="700" class="body small" text-anchor="middle"><tspan x="1162.5" dy="0">Is there enough</tspan><tspan x="1162.5" dy="20">evidence to conclude?</tspan></text><line x1="1162.5" y1="620" x2="1162.5" y2="585" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1340" y="630" width="205" height="116" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="1348" y1="630" x2="1537" y2="630" stroke="#C8432F" stroke-width="2.5"/><circle cx="1442.5" cy="630" r="8" fill="#C8432F" stroke="#FAF9F7" stroke-width="5"/><text x="1442.5" y="670" class="display h3" text-anchor="middle">issue</text><text x="1442.5" y="700" class="body small" text-anchor="middle"><tspan x="1442.5" dy="0">Release, continue</tspan><tspan x="1442.5" dy="20">or reframe?</tspan></text><line x1="1442.5" y1="620" x2="1442.5" y2="585" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1475,747 L1475,810 L350,810 L350,758" stroke="#C8432F" stroke-width="2" fill="none" stroke-dasharray="7 7" marker-end="url(#arrowAccent)"/><text x="800" y="842" class="body" text-anchor="middle" fill="#C8432F">New evidence arrives; affected work is reviewed. Prior state is not erased.</text></svg>