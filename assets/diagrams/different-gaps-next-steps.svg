<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Different gaps need different next steps.</title><desc id="desc">Unresolved-state diagram mapping analysis, acquisition, applicability, conflict and open-judgement gaps to different next actions.</desc><rect width="1600" height="900" fill="#FAF9F7"/><style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600&amp;display=swap');
.display{font-family:'Instrument Serif',Georgia,serif}.body{font-family:'Figtree',Arial,sans-serif}.mono{font-family:'DM Mono','Courier New',monospace;letter-spacing:1.8px}.subtitle{font-size:20px;fill:#555555}.h2{font-size:30px;fill:#0F0F0F}.h3{font-size:23px;fill:#0F0F0F}.bodytext{font-size:17px;fill:#555555}.small{font-size:14px;fill:#555555}.label{font-size:14px;fill:#555555;letter-spacing:2px}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/></marker><marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#C8432F"/></marker></defs><text x="40" y="68" class="display" style="font-size:46px;fill:#0F0F0F;"><tspan style="fill:#0F0F0F;">Different gaps need </tspan><tspan style="fill:#C8432F;font-style:italic;">different next steps.</tspan></text><text x="40" y="112" class="body subtitle" text-anchor="start">More reasoning is not always the right move. The kind of unresolved state determines what should happen next.</text><text x="50" y="158" class="mono label" text-anchor="start">WHAT IS UNRESOLVED</text><text x="850" y="158" class="mono label" text-anchor="start">NEXT ACTION</text><rect x="40" y="174" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="209" class="display" text-anchor="start" style="font-size:25px">Analysis gap</text><text x="62" y="238" class="body small" text-anchor="start">The evidence is preserved but has not been read closely enough.</text><line x1="750" y1="217" x2="830" y2="217" stroke="#C8432F" stroke-width="1.8" marker-end="url(#arrowAccent)"/><rect x="850" y="174" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="858" y1="174" x2="1542" y2="174" stroke="#C8432F" stroke-width="2.5"/><text x="872" y="209" class="display" text-anchor="start" style="font-size:25px">Run another bounded pass</text><text x="872" y="238" class="body small" text-anchor="start">Select different passages from material already preserved.</text><rect x="40" y="282" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="317" class="display" text-anchor="start" style="font-size:25px">Acquisition gap</text><text x="62" y="346" class="body small" text-anchor="start">Material needed for the question has not been obtained yet.</text><line x1="750" y1="325" x2="830" y2="325" stroke="#C8432F" stroke-width="1.8" marker-end="url(#arrowAccent)"/><rect x="850" y="282" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="858" y1="282" x2="1542" y2="282" stroke="#C8432F" stroke-width="2.5"/><text x="872" y="317" class="display" text-anchor="start" style="font-size:25px">Acquire different sources</text><text x="872" y="346" class="body small" text-anchor="start">Fetch the missing documents, then represent them for analysis.</text><rect x="40" y="390" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="425" class="display" text-anchor="start" style="font-size:25px">Applicability gap</text><text x="62" y="454" class="body small" text-anchor="start">A source exists but may not bear on this question or context.</text><line x1="750" y1="433" x2="830" y2="433" stroke="#C8432F" stroke-width="1.8" marker-end="url(#arrowAccent)"/><rect x="850" y="390" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="858" y1="390" x2="1542" y2="390" stroke="#C8432F" stroke-width="2.5"/><text x="872" y="425" class="display" text-anchor="start" style="font-size:25px">Test the fit before relying on it</text><text x="872" y="454" class="body small" text-anchor="start">Judge applicability; replace the source or narrow the claim.</text><rect x="40" y="498" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="533" class="display" text-anchor="start" style="font-size:25px">Conflicting evidence</text><text x="62" y="562" class="body small" text-anchor="start">Sources or claims point in different directions.</text><line x1="750" y1="541" x2="830" y2="541" stroke="#C8432F" stroke-width="1.8" marker-end="url(#arrowAccent)"/><rect x="850" y="498" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="858" y1="498" x2="1542" y2="498" stroke="#C8432F" stroke-width="2.5"/><text x="872" y="533" class="display" text-anchor="start" style="font-size:25px">Keep the divergence visible</text><text x="872" y="562" class="body small" text-anchor="start">Record both positions and look for evidence that discriminates.</text><rect x="40" y="606" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="62" y="641" class="display" text-anchor="start" style="font-size:25px">Open judgement</text><text x="62" y="670" class="body small" text-anchor="start">The evidence is in; the call belongs to the researcher.</text><line x1="750" y1="649" x2="830" y2="649" stroke="#C8432F" stroke-width="1.8" marker-end="url(#arrowAccent)"/><rect x="850" y="606" width="700" height="86" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><line x1="858" y1="606" x2="1542" y2="606" stroke="#C8432F" stroke-width="2.5"/><text x="872" y="641" class="display" text-anchor="start" style="font-size:25px">The researcher decides</text><text x="872" y="670" class="body small" text-anchor="start">Admit, qualify, defer or reject, and record the review depth.</text><text x="50" y="740" class="mono label" text-anchor="start">A WORKED CASE FROM THE EU–INDIA FTA RUN</text><rect x="40" y="762" width="440" height="72" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="64" y="792" class="body small" text-anchor="start"><tspan x="64" dy="0">A parent page located the</tspan><tspan x="64" dy="20">tariff schedule.</tspan></text><line x1="488" y1="798" x2="550" y2="798" stroke="#C8432F" stroke-width="1.5" marker-end="url(#arrowAccent)"/><rect x="560" y="762" width="450" height="72" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="584" y="792" class="body small" text-anchor="start"><tspan x="584" dy="0">Line-level terms sat in child</tspan><tspan x="584" dy="20">documents never acquired.</tspan></text><line x1="1018" y1="798" x2="1070" y2="798" stroke="#C8432F" stroke-width="1.5" marker-end="url(#arrowAccent)"/><rect x="1080" y="762" width="470" height="72" rx="8" fill="#FAF9F7" stroke="#DEDAD4" stroke-width="1.2"/><text x="1104" y="792" class="body small" text-anchor="start"><tspan x="1104" dy="0">The researcher stopped: another pass over</tspan><tspan x="1104" dy="20">the same pages was the wrong next action.</tspan></text><text x="40" y="866" class="body small" text-anchor="start">Routes are illustrative. Different unresolved states imply different actions; the workflow does not prescribe one rigid return route for every case.</text></svg>